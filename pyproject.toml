[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rheology-fit"
version = "0.1.0"
description = "Fit non-Newtonian flow curve models (Power-law, Herschel-Bulkley, Casson) to shear stress / shear rate data for food rheology."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Karen Khachatryan", email = "karen.khachatryan@gmail.com" },
]
keywords = [
    "rheology",
    "non-Newtonian fluids",
    "flow curve",
    "Herschel-Bulkley",
    "Casson model",
    "power law",
    "food science",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
gui = [
    "customtkinter>=5.2",
]
build = [
    "pyinstaller>=6.0",
]
release = [
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/karenkhachatryan-lab/rheology-fit"
Issues = "https://github.com/karenkhachatryan-lab/rheology-fit/issues"

[project.scripts]
rheology-fit = "rheology_fit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rheology_fit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
